version: "2"
linters:
  # govet, ineffassign, staticcheck and unused are in the default set.
  enable:
    - copyloopvar
    - dupword
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usetesting
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
