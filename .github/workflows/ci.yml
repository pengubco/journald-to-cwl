name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Uses the toolchain line, so CI follows `make update-go`.
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # sdjournal builds against systemd/sd-journal.h through cgo.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned so a new linter release cannot fail a commit that changed no code.
          version: v2.15.0
